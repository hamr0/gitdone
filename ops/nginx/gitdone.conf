# nginx vhost for signedreply.com — source of truth for the production
# reverse proxy. Lives on the VPS at /etc/nginx/conf.d/gitdone.conf.
#
# Deploy:
#   sudo install -m 644 ops/nginx/gitdone.conf /etc/nginx/conf.d/gitdone.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx -t validates before reload; a bad config never goes live (reload
# only swaps workers on success). Keep a .bak before replacing.
#
# Canonical host is the apex signedreply.com. www and mail 301 to it. ONE
# Let's Encrypt cert (CN signedreply.com, SANs mail/www) covers every name and
# auto-renews via webroot — the single :80 ACME server below serves /.well-known
# for all of them, so there is no per-host renewal gap and nothing to clean up
# by hand. (git-done.com was retired in the rename; its public delegation is
# gone — NXDOMAIN at the .com registry — so no redirect server is kept for it.)
#
# Two hardening concerns are handled HERE rather than in the app, because
# nginx terminates TLS and is the right home for transport/edge policy
# (security audit 2026-05-28, findings M2 + M3):
#   M2 — per-IP rate limit on the unauthenticated create endpoints.
#   M3 — security response headers.
#
# §XFF — X-Forwarded-For is set with $remote_addr (OVERWRITE), never
# $proxy_add_x_forwarded_for (APPEND). The app's per-IP login rate-limiter
# (auth.sourceIp → knowless determineSourceIp) trusts the LEFTMOST XFF element
# as the real client. With $remote_addr nginx replaces the header with the true
# peer, so that element is trustworthy. Appending (or omitting the directive)
# would leave the leftmost element CLIENT-CONTROLLED — an attacker could forge
# X-Forwarded-For to mint unlimited per-IP buckets and bypass the cap. See PRD
# finding #48 and deployment.md §9. Do not "restore" the append form.

# M2 — rate-limit zone for the unauthenticated event-creation POSTs.
# Each POST /events and POST /crypto fires an outbound magic-link email
# to a client-supplied address, so an unthrottled endpoint is a mail-
# amplification vector. Keyed on client IP. ~12 req/min sustained with a
# burst of 6 comfortably covers a human's preview→edit→confirm round-trip
# while capping volumetric abuse from any single source.
limit_req_zone $binary_remote_addr zone=gitdone_create:10m rate=12r/m;

# --- :80 — ACME for every cert name + redirect everything to canonical https apex.
server {
  listen 80;
  listen [::]:80;
  server_name signedreply.com www.signedreply.com mail.signedreply.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://signedreply.com$request_uri; }
}

# --- :443 — non-canonical names (www, mail) 301 to apex.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.signedreply.com mail.signedreply.com;

  ssl_certificate     /etc/letsencrypt/live/signedreply.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/signedreply.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://signedreply.com$request_uri;
}

# --- signedreply.com: the application ---
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name signedreply.com;

  ssl_certificate     /etc/letsencrypt/live/signedreply.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/signedreply.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  client_max_body_size 25m;

  # M3 — security response headers. `always` so they are emitted on error
  # responses too. Inherited by every location below that declares no
  # add_header of its own (nginx add_header inheritance rule).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # CSP permits inline script/style: the app ships inline <script> blocks
  # (e.g. the .copyable enhancer in src/web/templates.js) and pervasive
  # style="" attributes. The real wins from the edge are frame-ancestors
  # (clickjacking), object-src, base-uri and form-action. Tightening
  # script-src to a per-request nonce is a follow-up app-layer change.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

  # M2 — the two unauthenticated create endpoints get the tight throttle.
  # 429 on exceed. No Upgrade/Connection headers here: these are plain
  # form POSTs, not websocket/SSE (those go through location / below).
  location = /events {
    limit_req zone=gitdone_create burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;  # OVERWRITE — see §XFF note
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location = /crypto {
    limit_req zone=gitdone_create burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;  # OVERWRITE — see §XFF note
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;  # OVERWRITE — see §XFF note
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }
}
